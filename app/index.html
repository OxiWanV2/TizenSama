<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>TizenSama</title>
<script>
(function () {
  var release = 'v1.4.1';
  var base = /^\/module\//.test(location.pathname) ? 'https://cdn.jsdelivr.net/gh/OxiWanV2/TizenSama@' + release + '/app/' : '';
  window.TS_ASSETS = base;
  document.write('<link rel="stylesheet" href="' + base + 'css/app.css">');
})();
</script>
</head>
<body>
<div id="app">
  <div id="backdrop" class="backdrop"><canvas class="backdrop-img" width="192" height="108"></canvas><canvas class="backdrop-img" width="192" height="108"></canvas><div class="backdrop-tint"></div></div>
  <div id="screens"></div>
  <nav id="tabbar" class="tabbar"><div class="tabbar-pill"></div></nav>
  <div id="modal-layer"></div>
  <div id="toast" class="toast"></div>
  <div id="splash" class="splash">
    <div class="splash-logo"><span class="splash-mark"></span><span class="splash-name">TizenSama</span></div>
    <div class="spinner"></div>
    <div class="splash-status">Chargement du catalogue</div>
  </div>
</div>
<script>
(function () {
  var files = ['js/core.js', 'js/crypto.js', 'js/vault.js', 'js/data.js', 'js/focus.js', 'js/ui.js', 'js/pin.js', 'js/screens.js', 'js/native.js', 'js/player.js', 'js/app.js'], base = window.TS_ASSETS || '';
  for (var i = 0; i < files.length; i++) {
    var s = document.createElement('script');
    s.src = base + files[i];
    s.async = false;
    document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
